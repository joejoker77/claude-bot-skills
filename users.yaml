# Per-skill and per-MCP bot user whitelist.
#
# An entry listed below is deployed ONLY to the bot users in its `users` field.
# An entry NOT listed here is deployed to ALL 8 bots by default.
#
# Bot users on 185.168.208.235:
#   artemii, boris, daria, dmrudenko, leonid, team, vitaliy, viveanne
#
# Use this file when:
#   - the entry depends on per-user resources (scripts, secrets, mounts) that
#     don't exist on every bot
#   - the entry is internal/staff-only and shouldn't reach paying users
#   - the entry is a canary / experiment
#
# Schema:
#   skills:
#     <skill-slug>:
#       users: [ <bot-user-1>, <bot-user-2>, ... ]
#       reason: "short one-line reason for the restriction"
#
#   mcp:
#     <mcp-slug>:
#       users: [ <bot-user-1>, ... ]
#       reason: "short one-line reason"
#
# MCP secrets and per-user config
# --------------------------------
# Templates (mcp/<slug>/template.json) declare two kinds of placeholders:
#
#   ${USER_CONFIG:key}  — non-secret per-user values (file paths, IDs, etc.)
#                         Set HERE under mcp.<slug>.user_config.<bot-user>.<key>
#                         These live in git, safe because they are not credentials.
#
#   ${SECRET:name}      — real API keys / tokens. NEVER in git, NEVER in this
#                         file. Stored in the OneCLI vault running locally on
#                         the host (127.0.0.1:10254). Bot processes never hold
#                         the raw value — OneCLI's gateway proxy injects them
#                         into outbound HTTPS requests at the host-pattern.
#
# To add a secret for a bot:
#   mcp-set-secret <user> <slug> <secret-name>
# (interactive, read -rs, value never lands in shell history). The secret
# is bound to that bot's OneCLI agent, so it never bleeds across bots.

skills:
  proposal-generator:
    users:
      - dmrudenko
    reason: "Depends on ~/aas-proposals/generate.py and ~/.env.aas (CF_TOKEN), which currently exist only on dmrudenko's home."

  # mcp-installer is now deployed to ALL bots by default — entry removed.
  # Prerequisite: each bot needs the narrow sudoers entry
  #   <bot-user> ALL=(root) NOPASSWD: /usr/local/sbin/mcp-set-secret <bot-user> *
  # installed in /etc/sudoers.d/mcp-installer-<bot-user>. The skill's preflight
  # check warns when SUDO_MISSING — bots without the entry won't be able to
  # set secrets, but the skill won't crash; it just escalates to the operator.

mcp:
  filesystem:
    users:
      - vitaliy
    user_config:
      vitaliy:
        fs_root: /home/vitaliy/work/mcp-sandbox
    reason: "Initial MCP-sharing rollout — single canary bot. After validation, expand to others."
