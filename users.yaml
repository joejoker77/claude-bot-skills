# Per-skill bot user whitelist.
#
# A skill listed below is deployed ONLY to the bot users in its `users` field.
# A skill NOT listed here is deployed to ALL 8 bots by default.
#
# Bot users on 185.168.208.235:
#   artemii, boris, daria, dmrudenko, leonid, team, vitaliy, viveanne
#
# Use this file when:
#   - the skill depends on per-user resources (scripts, secrets, mounts) that
#     don't exist on every bot
#   - the skill is internal/staff-only and shouldn't reach paying users
#   - the skill is a canary / experiment
#
# Schema:
#   skills:
#     <skill-slug>:
#       users: [ <bot-user-1>, <bot-user-2>, ... ]
#       reason: "short one-line reason for the restriction"

skills:
  proposal-generator:
    users:
      - dmrudenko
    reason: "Depends on ~/aas-proposals/generate.py and ~/.env.aas (CF_TOKEN), which currently exist only on dmrudenko's home."
